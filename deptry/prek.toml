#:schema https://www.schemastore.org/prek.json
# Per-project deptry check. prek's workspace mode discovers this file and runs
# the hook from this directory, so deptry reads this project's pyproject.toml
# (incl. its `[tool.deptry]` config). Scanning `.` (deptry's default) covers
# the whole project; the generated `sdk/` and `clients/` are excluded, and `--known-first-party`
# names this project's own package so a `src` layout isn't flagged as third-party.
# This project is named deptry, so its own uv.lock can't lock the deptry tool: the hook runs
# the one the repository root's uv.lock locks.
[[repos]]
repo = "local"
hooks = [
  { id = "deptry", name = "deptry", entry = "uv run --frozen --project .. --only-group dev deptry --known-first-party deptry --extend-exclude sdk --extend-exclude clients .", language = "system", pass_filenames = false, files = '(\.py|pyproject\.toml)$' },
]
