[project]
name = "deptry"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = ["dagger-io", "anyio", "opentelemetry-api"]

[build-system]
requires = ["uv_build>=0.8.4,<0.9.0"]
build-backend = "uv_build"

[tool.uv.sources]
dagger-io = { path = "sdk", editable = true }

# Map distributions to the import packages they ship, so deptry doesn't flag
# those imports as missing/unused: `dagger-io` ships `dagger`, and
# `opentelemetry-api` ships the `opentelemetry` namespace.
[tool.deptry.package_module_name_map]
dagger-io = "dagger"
opentelemetry-api = "opentelemetry"

[dependency-groups]
dev = [
    "pytest>=9.0.3",
    "zensical>=0.0.57",
]
docs = [
    "pymdown-extensions>=11.0.1",
    "zensical>=0.0.44",
]
