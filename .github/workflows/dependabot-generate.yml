name: Dependabot generate

on:
  pull_request:

# A newer push to the PR supersedes an in-flight regeneration.
concurrency:
  group: dependabot-generate-${{ github.event.pull_request.number }}
  cancel-in-progress: true

env:
  DAGGER_VERSION: "1.0.0-beta.25"

# Dependabot only bumps the files it knows about, which leaves the files
# `dagger generate` writes stale and fails the `*/generate/stale` checks. This
# regenerates them and commits the result to the Dependabot PR.
jobs:
  generate:
    name: generate
    if: github.event.pull_request.user.login == 'dependabot[bot]'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false

      # Runs on the runner's own engine: Dependabot PRs can't read Actions secrets.
      - name: Regenerate
        uses: dagger/dagger-for-github@27b130bf0f79a7f6fbbbe0fbca6760dc9bb40a77 # v8.4.1
        with:
          version: ${{ env.DAGGER_VERSION }}
          verb: generate
          args: -y

      # `[dependabot skip]` lets Dependabot keep rebasing the PR over this commit;
      # this workflow then regenerates on top of the rebase.
      - name: Commit generated files
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
        run: |
          git add --all
          if git diff --cached --quiet; then
            exit 0
          fi
          git -c user.name="github-actions[bot]" \
            -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
            commit --message "chore: regenerate [dependabot skip]"
          git push "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}" "HEAD:${HEAD_REF}"
