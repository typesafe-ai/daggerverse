name: Release

on:
  push:
    tags: ["*/v[0-9]*"]

# Dagger 1.0 modules are published by their git tag, which triggers this
# workflow; it only publishes the tagged version's section of the module's
# CHANGELOG.md (written by `just release <module>`) as a GitHub release.
jobs:
  release:
    name: release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Extract module and version from tag
        id: meta
        run: |
          echo "module=${GITHUB_REF_NAME%%/v*}" >> "$GITHUB_OUTPUT"
          echo "version=${GITHUB_REF_NAME#*/}" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0
        with:
          persist-credentials: false

      - name: Extract release notes
        env:
          MODULE: ${{ steps.meta.outputs.module }}
          VERSION: ${{ steps.meta.outputs.version }}
        run: |
          awk -v heading="## ${VERSION#v} " '/^## /{p = index($0, heading) == 1; next} p' \
            "${MODULE}/CHANGELOG.md" > /tmp/notes.md
          if [ ! -s /tmp/notes.md ]; then
            echo "::error::${MODULE}/CHANGELOG.md has no section for ${VERSION#v}; run \`just release ${MODULE}\`"
            exit 1
          fi

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          MODULE: ${{ steps.meta.outputs.module }}
          VERSION: ${{ steps.meta.outputs.version }}
        run: |
          gh release create "${TAG}" \
            --title "${MODULE} ${VERSION}" \
            --notes-file /tmp/notes.md
