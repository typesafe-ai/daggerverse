name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # A no-op kept for anything that still expects a `check` status: Dagger Cloud
  # reports the checks to GitHub itself (`Run Dagger Checks`), which the ruleset requires.
  check:
    name: check
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - run: echo "Dagger Cloud reports the checks to GitHub as 'Run Dagger Checks'."
