[project]
name = "ruff"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = ["dagger-io"]

[build-system]
requires = ["uv_build>=0.8.4,<0.9.0"]
build-backend = "uv_build"

[tool.uv.sources]
dagger-io = { path = "sdk", editable = true }

# The `dagger-io` distribution ships the `dagger` import package; map it so
# deptry doesn't flag `import dagger` as a missing/unused dependency.
[tool.deptry.package_module_name_map]
dagger-io = "dagger"

[dependency-groups]
dev = [
    "pytest>=9.0.3",
]
docs = [
    "pymdown-extensions>=11.0.1",
    "zensical>=0.0.44",
]
