line-length = 120
# Generated Dagger SDK and client code. `force-exclude` keeps it excluded when a
# hook passes these files explicitly.
extend-exclude = ["**/sdk", "**/clients"]
force-exclude = true

[lint]
ignore = [
    # PEP 695 `type X = ...` aliases produce a `TypeAliasType` that Dagger's
    # runtime type introspection (beartype) can't resolve, breaking module
    # loading. Keep the `X: TypeAlias = ...` form for annotations Dagger reads.
    "UP040",
    "UP037",  # keep quotes around type annotations
]
