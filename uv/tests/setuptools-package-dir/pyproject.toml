[project]
name = "setuptools-package-dir"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = ["dagger-io", "dagger-clients-core"]

[build-system]
requires = ["uv_build>=0.8.4,<0.9.0"]
build-backend = "uv_build"

[tool.uv.sources]
dagger-io = { workspace = true }
dagger-clients-core = { workspace = true }

# Map distributions to the import packages they ship, so deptry doesn't flag
# those imports as missing/unused: `dagger-io` ships `dagger`, and the
# generated `dagger-clients-*` distributions ship the `dagger_clients` namespace.
[tool.deptry.package_module_name_map]
dagger-io = "dagger"
dagger-clients-core = "dagger_clients"

# `dagger generate` adds the core client, but this module only uses the SDK.
[tool.deptry.per_rule_ignores]
DEP002 = ["dagger-clients-core"]

[tool.uv.workspace]
members = ["sdk", "clients/core"]
