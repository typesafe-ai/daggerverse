# Popular projects the uv module must build, editable and non-editable. Each
# entry covers a layout/backend combination the others don't.
#
#   repo:     GitHub `owner/name`
#   rev:      commit SHA (release tag in the comment)
#   packages: package directories (relative to the repo root) to install
#   imports:  modules that must import after the build
#   builder:  argument-less `UvWorkspaceBuilder` methods to call (optional)
#   base:     base image, e.g. one with a Rust toolchain (optional)
#   handlers: built-in build backend handlers to configure (optional): each
#             `build_backend_handlers()` function, e.g. `maturin`, mapped to
#             distribution names and their extra build inputs

# pdm-backend, flat layout, version read from the module (`[tool.pdm] version`).
- repo: fastapi/fastapi
  rev: 7a0a3f0b286c6c865cf4398ea0e957a87b8bffa4 # 0.162.0
  packages: [.]
  imports: [fastapi]

# hatchling, flat layout auto-discovered by hatch, readme outside the package root.
- repo: litestar-org/litestar
  rev: ac33702eea7aa3c99d62711bce2d55bdada6b944 # v2.25.0
  packages: [.]
  imports: [litestar]

# hatchling, src layout via wheel `packages`, readme built by a custom metadata
# hook script (`scripts/hatch_metadata.py`) outside the import package.
- repo: openai/openai-python
  rev: 23a6be4b8ab346609babc1337b445e4ee658137d # v3.40.0
  packages: [.]
  imports: [openai]

# poetry-core with PEP 621 metadata, flat layout, `[tool.poetry] include` of a
# file inside the package.
- repo: python-poetry/tomlkit
  rev: a0b15ebb09167ede584fc36ad5362fc3039b0530 # 0.15.2
  packages: [.]
  imports: [tomlkit]

# One member of a ~130-member workspace. Its runtime closure mixes flit_core
# providers (dotted `[tool.flit.module]` names under `src/`), hatchling wheel
# `packages`, and a `bypass-selection` root; `_shared` modules are symlinks into
# sibling directories. The default `dev` group pulls in most of the workspace.
- repo: apache/airflow
  rev: aa19d2dbb9ed187ec01957a92848d9b005e9ba9d # 3.3.2
  packages: [airflow-core]
  imports: [airflow]
  builder: [without_default_groups]

# maturin, pure Rust: the package is a crate in a Cargo workspace whose
# `Cargo.toml`, `Cargo.lock` and sibling crate (`crates/jiter`) sit above it,
# passed to a maturin handler.
- repo: pydantic/jiter
  rev: fc2da0bd1fb699a6c4e9641e9e1c06fa6d5d93e8 # v0.18.0
  packages: [crates/jiter-python]
  imports: [jiter]
  base: rust:1.90.0-slim-bookworm
  handlers:
    maturin:
      # Cargo loads every workspace member's declared targets, tests and benches included.
      jiter:
        - /Cargo.toml
        - /Cargo.lock
        - /crates/jiter/Cargo.toml
        - /crates/jiter/build.rs
        - /crates/jiter/src/**
        - /crates/jiter/tests/*.rs
        - /crates/jiter/benches/*.rs

# maturin, mixed layout: a Python package with a native submodule
# (`watchfiles._rust_notify`); version and readme come from `Cargo.toml`.
- repo: samuelcolvin/watchfiles
  rev: e74b8fc7d8d9e35c3b6bb88af0aef5ea82ee815e # v1.3.0
  packages: [.]
  imports: [watchfiles, watchfiles._rust_notify]
  base: rust:1.90.0-slim-bookworm
