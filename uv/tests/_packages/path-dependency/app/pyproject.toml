[project]
name = "app"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = ["lib-pkg"]

[build-system]
requires = ["uv_build>=0.10.4,<0.11.0"]
build-backend = "uv_build"

# A plain `path` source, without `editable = true`: uv installs it as a built wheel.
[tool.uv.sources]
lib-pkg = { path = "../my-lib" }
