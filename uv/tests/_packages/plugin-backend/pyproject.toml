[project]
name = "plugged-app"
dynamic = ["version"]
requires-python = ">=3.13"
dependencies = []

[build-system]
requires = ["setuptools>=80"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = { "" = "python" }
packages = ["plugged"]

[tool.setuptools.dynamic]
version = { file = "VERSION" }
