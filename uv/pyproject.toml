[project]
name = "uv"
version = "0.3.1"
requires-python = ">=3.13"
dependencies = ["dagger-io", "packaging", "tomlkit", "dagger-clients-core", "dagger-clients-pyproject"]

[build-system]
requires = ["uv_build>=0.8.4,<0.9.0"]
build-backend = "uv_build"

[tool.uv.sources]
dagger-io = { workspace = true }
dagger-clients-core = { workspace = true }
dagger-clients-pyproject = { workspace = true }

# Map distributions to the import packages they ship, so deptry doesn't flag
# those imports as missing/unused: `dagger-io` ships `dagger`, and the
# generated `dagger-clients-*` distributions ship the `dagger_clients` namespace.
[tool.deptry.package_module_name_map]
dagger-io = "dagger"
dagger-clients-core = "dagger_clients"
dagger-clients-pyproject = "dagger_clients"

[dependency-groups]
dev = [
    "deptry==0.25.1",
    "pyrefly>=1.4.1",
    "pytest>=9.0.3",
]
docs = [
    "pymdown-extensions>=11.0.1",
    "zensical>=0.1.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.uv.workspace]
members = ["sdk", "clients/core", "clients/pyproject"]

[tool.pyrefly]
preset = "strict"
project-includes = ["src", "tests"]
# Fixture projects and a nested Dagger module, on top of the defaults.
project-excludes = ["tests/_packages", "tests/setuptools-package-dir", "**/node_modules", "**/__pycache__", "**/*venv/**", "**/.[!/.]*/**"]
