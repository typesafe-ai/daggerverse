[project]
name = "dagger-clients-setuptools-package-dir"
version = "0.0.0"
dependencies = ["dagger-io", "dagger-clients-core"]

[build-system]
requires = ["uv_build>=0.8.4,<0.14.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "dagger_clients.setuptools_package_dir"

[tool.dagger]
generated = "client"
