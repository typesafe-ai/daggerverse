# Configuration file for `prek`, a git hook framework written in Rust.
# See https://prek.j178.dev for more information.
#:schema https://www.schemastore.org/prek.json

[[repos]]
repo = "builtin"
hooks = [
    { id = "trailing-whitespace" },
    { id = "end-of-file-fixer" },
    { id = "check-added-large-files" },
]

[[repos]]
repo = "local"
hooks = [
  # Ruff comes from the project's `uv.lock` (via `uv run`) so the hook and the
  # rest of the toolchain stay on one pinned version.
  { id = "ruff-check", name = "ruff check", entry = "uv run ruff check --fix", language = "system", types_or = ["python", "pyi"], require_serial = true },
  { id = "ruff-format", name = "ruff format", entry = "uv run ruff format", language = "system", types_or = ["python", "pyi"], require_serial = true },
  { id = "pinact", name = "Pin GitHub Actions", entry = "pinact run", language = "system", pass_filenames = false, files = '^\.github/'},
]

[[repos]]
repo = "https://github.com/zizmorcore/zizmor-pre-commit"
rev = "v1.25.2"
hooks = [
  { id = "zizmor" },
]
